    <main class="feedback-container">

    <section class="feedback-header">
        <h1>Student Feedback</h1>
        <p>We value your opinion! Help us improve StudentHub by sharing your feedback.</p>
    </section>

    <section class="feedback-form-section">
        <form action="#" method="post">

            <!-- Student Name -->
            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!-- Feedback Category -->
            <div class="form-group">
                <label for="category">Feedback Category</label>
                <select id="category" name="category" required>
                    <option value="">-- Select Category --</option>
                    <option>Website Design</option>
                    <option>Study Material</option>
                    <option>Faculty</option>
                    <option>Technical Issue</option>
                    <option>Suggestions</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Rating -->
            <div class="form-group">
                <label>Rate Your Experience</label>
                <div class="rating">
                    <label><input type="radio" name="rating" value="1"> 1 </label>
                    <label><input type="radio" name="rating" value="2"> 2 </label>
                    <label><input type="radio" name="rating" value="3"> 3 </label>
                    <label><input type="radio" name="rating" value="4"> 4 </label>
                    <label><input type="radio" name="rating" value="5"> 5 </label>
                </div>
            </div>

            <!-- Feedback -->
            <div class="form-group">
                <label for="feedback">Your Feedback</label>
                <textarea id="feedback" name="feedback" rows="6"
                    placeholder="Write your feedback here..." required></textarea>
            </div>

            <!-- Recommend -->
            <div class="form-group">
                <label>Would you recommend StudentHub?</label>
                <label><input type="radio" name="recommend" value="Yes"> Yes</label>
                <label><input type="radio" name="recommend" value="No"> No</label>
            </div>

            <!-- Submit -->
            <div class="form-group">
                <button type="submit">Submit Feedback</button>
            </div>

        </form>
    </section>

</main>


</body>
</html>
