</head>
<body>
    <header>
        <h1><b><img src="/images/web logo.jpg" alt="web logo" >STUDENTHUB</b></h1>
        <nav class="nav1">
            <ul>
                <li><a href="about.html">About</a></li>
                <li><a href="home.html">Learning</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="privacy.html">Privacy</a></li>
                <li><a href="terms.html">Terms & Conditions</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section >
            <h2>Register</h2>
            <p>Create your StudentHub account to access resources and campus services.</p>
            <form action="#" method="post">
                <div class="form-row">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first_name" required placeholder="John">
                </div>
                <div class="form-row" >
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last_name" required placeholder="Doe">
                </div>
                <div class="form-row">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-row" >
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="student123">
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Choose a secure password">
                </div>
                <div class="form-row">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" required placeholder="Repeat your password">
                </div>
                <div class="form-row">
                    <label for="program">Program / Year</label>
                    <select id="program" name="program" required>
                        <option value="">Select a program</option>
                        <option value="bsc">Bachelor of Science</option>
                        <option value="ba">Bachelor of Arts</option>
                        <option value="dip">Diploma</option>
                        <option value="course">Short Course</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>
                        <input type="checkbox" id="terms" name="terms" required class="input-checkbox">
                        I agree to the terms and conditions
                    </label>
                </div>
                <div >
                    <button type="submit" class="btn-submit">Register</button>
                    <a href="login.html" style="color: #294a7d; text-decoration: none;">Already have an account?</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
