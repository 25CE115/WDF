<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Driving Simulation — Supercar Edition</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0b1020; font-family:'Segoe UI',Arial,sans-serif; }
  #canvas-container { width:100vw; height:100vh; display:block; }
  #fx-canvas { position:fixed; inset:0; pointer-events:none; z-index:5; }

  #instructions {
    position:fixed; top:20px; left:20px; color:#fff;
    background:rgba(10,15,30,0.55); backdrop-filter:blur(6px);
    padding:14px 18px; border-radius:12px; border:1px solid rgba(255,255,255,0.15);
    font-size:13px; line-height:1.7; user-select:none; pointer-events:none; max-width:230px; z-index:6;
  }
  #instructions b { color:#7cc7ff; }

  #title {
    position:fixed; top:20px; right:20px; color:#fff;
    background:rgba(10,15,30,0.55); backdrop-filter:blur(6px);
    padding:10px 18px; border-radius:12px; border:1px solid rgba(255,255,255,0.15);
    font-size:15px; font-weight:600; letter-spacing:0.5px; user-select:none; pointer-events:none; z-index:6;
  }

  #hudWrap {
    position:fixed; bottom:16px; left:16px; z-index:6; user-select:none; pointer-events:none;
    display:flex; align-items:flex-end; gap:14px;
  }
  #gaugeCanvas { display:block; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
  #sideStats { background:rgba(10,15,30,0.55); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.15);
    border-radius:12px; padding:10px 16px; color:#fff; min-width:150px; }
  #gearBig { font-size:26px; font-weight:800; letter-spacing:1px; }
  #rpmBarBg { width:130px; height:8px; background:rgba(255,255,255,0.15); border-radius:4px; margin-top:6px; overflow:hidden; }
  #rpmBarFill { height:100%; width:0%; background:linear-gradient(90deg,#3fdc6a,#f4d13d,#ff4444); transition:width 0.05s linear; }
  #boostLabel { font-size:11px; opacity:0.75; margin-top:8px; }
  #boostBarBg { width:130px; height:8px; background:rgba(255,255,255,0.15); border-radius:4px; margin-top:3px; overflow:hidden; }
  #boostBarFill { height:100%; width:100%; background:linear-gradient(90deg,#39c9ff,#8b6bff); }

  #minimap { position:fixed; bottom:16px; right:16px; width:160px; height:160px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.25); background:rgba(10,15,30,0.55); backdrop-filter:blur(6px); z-index:6; }

  #resetBtn {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background:rgba(124,199,255,0.15); border:1px solid rgba(124,199,255,0.5); color:#7cc7ff;
    padding:8px 18px; border-radius:10px; font-size:13px; cursor:pointer; backdrop-filter:blur(6px); z-index:6;
  }
  #resetBtn:hover { background:rgba(124,199,255,0.28); }

  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%);
    opacity:0; transition:opacity 0.15s linear;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<canvas id="fx-canvas"></canvas>
<div id="vignette"></div>

<div id="title">🏎️ DRIVE SIM 3D — Supercar Edition</div>

<div id="instructions">
  <b>W / ↑</b> — Accelerate<br>
  <b>S / ↓</b> — Brake / Reverse<br>
  <b>A D / ← →</b> — Steer<br>
  <b>Space</b> — Handbrake (drift!)<br>
  <b>Shift</b> — Nitro Boost<br>
  <b>C</b> — Change Camera<br>
  <b>R</b> — Reset Car
</div>

<div id="hudWrap">
  <canvas id="gaugeCanvas" width="180" height="110"></canvas>
  <div id="sideStats">
    <div id="gearBig">N</div>
    <div id="rpmBarBg"><div id="rpmBarFill"></div></div>
    <div id="boostLabel">NITRO</div>
    <div id="boostBarBg"><div id="boostBarFill"></div></div>
  </div>
</div>

<canvas id="minimap"></canvas>
<button id="resetBtn">Reset Position (R)</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // =========================================================================
  //  RENDERER / SCENE / CAMERA
  // =========================================================================
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
  const BASE_FOV = 70;
  const MAX_FOV = 92;

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // =========================================================================
  //  SKY DOME (gradient shader) + SUN GLOW + CLOUDS
  // =========================================================================
  const skyGeo = new THREE.SphereGeometry(900, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x2e6fd9) },
      bottomColor: { value: new THREE.Color(0xcfe8ff) },
      offset: { value: 20 },
      exponent: { value: 0.6 }
    },
    vertexShader: `
      varying vec3 vWorldPosition;
      void main() {
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPosition.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      uniform float offset;
      uniform float exponent;
      varying vec3 vWorldPosition;
      void main() {
        float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
  scene.fog = new THREE.FogExp2(0xbfe0ff, 0.0032);

  function makeRadialTexture(inner, outer, size) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, inner); g.addColorStop(1, outer);
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }

  // sun glow sprite
  const sunTex = makeRadialTexture('rgba(255,250,230,1)', 'rgba(255,250,230,0)', 256);
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTex, transparent: true, depthWrite: false }));
  sunSprite.scale.set(140, 140, 1);
  sunSprite.position.set(260, 180, 120);
  scene.add(sunSprite);

  // clouds
  const cloudTex = makeRadialTexture('rgba(255,255,255,0.9)', 'rgba(255,255,255,0)', 256);
  const cloudMat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, depthWrite: false, opacity: 0.75 });
  const clouds = [];
  for (let i = 0; i < 45; i++) {
    const s = new THREE.Sprite(cloudMat);
    const scale = 40 + Math.random() * 70;
    s.scale.set(scale, scale * 0.45, 1);
    s.position.set((Math.random() - 0.5) * 1200, 110 + Math.random() * 90, (Math.random() - 0.5) * 1200);
    scene.add(s);
    clouds.push(s);
  }

  // distant low-poly mountains ring
  const mountMat = new THREE.MeshLambertMaterial({ color: 0x5c6f8a });
  for (let i = 0; i < 26; i++) {
    const ang = (i / 26) * Math.PI * 2 + Math.random() * 0.1;
    const r = 420 + Math.random() * 120;
    const h = 60 + Math.random() * 90;
    const m = new THREE.Mesh(new THREE.ConeGeometry(60 + Math.random() * 40, h, 5), mountMat);
    m.position.set(Math.cos(ang) * r, h / 2 - 4, Math.sin(ang) * r);
    m.rotation.y = Math.random() * Math.PI;
    scene.add(m);
  }

  // =========================================================================
  //  LIGHTING
  // =========================================================================
  const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x3d5a2d, 0.85);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff2d6, 1.25);
  sun.position.set(80, 130, 50);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -90; sun.shadow.camera.right = 90;
  sun.shadow.camera.top = 90; sun.shadow.camera.bottom = -90;
  sun.shadow.camera.far = 400;
  sun.shadow.bias = -0.0012;
  scene.add(sun);
  scene.add(sun.target);

  const fillLight = new THREE.DirectionalLight(0xaac8ff, 0.25);
  fillLight.position.set(-60, 40, -60);
  scene.add(fillLight);

  // =========================================================================
  //  GROUND
  // =========================================================================
  function makeGrassTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#4f7f3f'; ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 3000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(70,120,55,0.5)' : 'rgba(95,150,70,0.4)';
      ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(120, 120);
    return tex;
  }
  const groundSize = 800;
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(groundSize, groundSize, 1, 1),
    new THREE.MeshLambertMaterial({ map: makeGrassTexture() })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // scattered rocks
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x8b8b86, roughness: 0.95 });
  const rocks = [];
  for (let i = 0; i < 60; i++) {
    const r = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4 + Math.random() * 0.8, 0), rockMat);
    r.position.set((Math.random() - 0.5) * 480, 0.3, (Math.random() - 0.5) * 480);
    r.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    r.castShadow = true; r.receiveShadow = true;
    rocks.push(r);
  }

  // =========================================================================
  //  TRACK (closed loop curve + road ribbon + curbs + centerline)
  // =========================================================================
  const trackPoints = [
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(60, 0, -20), new THREE.Vector3(120, 0, 0),
    new THREE.Vector3(150, 0, 60), new THREE.Vector3(120, 0, 120), new THREE.Vector3(40, 0, 150),
    new THREE.Vector3(-40, 0, 130), new THREE.Vector3(-90, 0, 60), new THREE.Vector3(-80, 0, -20),
    new THREE.Vector3(-30, 0, -50)
  ];
  const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'catmullrom', 0.5);
  const roadWidth = 14;
  const segments = 420;
  const curvePts = trackCurve.getPoints(segments);
  const curveNormals = curvePts.map((p, i) => {
    const pNext = curvePts[(i + 1) % curvePts.length];
    const dir = new THREE.Vector3().subVectors(pNext, p).normalize();
    return new THREE.Vector3(-dir.z, 0, dir.x);
  });

  function buildRibbon(width, yOff, uvScale) {
    const positions = [], uvs = [], indices = [];
    for (let i = 0; i < curvePts.length; i++) {
      const p = curvePts[i], normal = curveNormals[i];
      const left = new THREE.Vector3().addVectors(p, normal.clone().multiplyScalar(width / 2));
      const right = new THREE.Vector3().addVectors(p, normal.clone().multiplyScalar(-width / 2));
      positions.push(left.x, yOff, left.z, right.x, yOff, right.z);
      uvs.push(0, i * uvScale, 1, i * uvScale);
    }
    for (let i = 0; i < curvePts.length; i++) {
      const a = i * 2, b = i * 2 + 1, c = ((i + 1) % curvePts.length) * 2, d = ((i + 1) % curvePts.length) * 2 + 1;
      indices.push(a, b, c, b, d, c);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  function makeAsphaltTexture() {
    const c = document.createElement('canvas'); c.width = 128; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#3a3a40'; ctx.fillRect(0, 0, 128, 512);
    for (let i = 0; i < 3500; i++) {
      const v = 40 + Math.random() * 40;
      ctx.fillStyle = `rgb(${v},${v},${v+2})`;
      ctx.fillRect(Math.random() * 128, Math.random() * 512, 1.5, 1.5);
    }
    // center dashed line baked lightly (visual guide, real dashed line added as separate mesh too)
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 4;
    ctx.setLineDash([18, 18]);
    ctx.beginPath(); ctx.moveTo(64, 0); ctx.lineTo(64, 512); ctx.stroke();
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 60);
    return tex;
  }
  const roadMat = new THREE.MeshStandardMaterial({ map: makeAsphaltTexture(), roughness: 0.92, metalness: 0.05 });
  const roadMesh = new THREE.Mesh(buildRibbon(roadWidth, 0.02, 0.2), roadMat);
  roadMesh.receiveShadow = true;
  scene.add(roadMesh);

  // curb ribbon (red/white) slightly wider than road, alternating color via vertex colors
  function makeCurbTexture() {
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#dd2222'; ctx.fillRect(0, 0, 64, 32);
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(0, 32, 64, 32);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 80);
    return tex;
  }
  const curbMat = new THREE.MeshStandardMaterial({ map: makeCurbTexture(), roughness: 0.7 });
  const curbMesh = new THREE.Mesh(buildRibbon(roadWidth + 1.4, 0.021, 0.5), curbMat);
  scene.add(curbMesh);

  // center dashed line (raised slightly, crisp)
  const dashPts = [];
  for (let i = 0; i < curvePts.length; i += 2) dashPts.push(new THREE.Vector3(curvePts[i].x, 0.05, curvePts[i].z));
  const dashedLine = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(dashPts),
    new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 3, linewidth: 2 })
  );
  dashedLine.computeLineDistances();
  scene.add(dashedLine);

  // floodlight-style track posts (thin, spaced)
  const postGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.3, 6);
  const postMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
  for (let i = 0; i < curvePts.length; i += 16) {
    const p = curvePts[i], normal = curveNormals[i];
    [1, -1].forEach(side => {
      const pos = new THREE.Vector3().addVectors(p, normal.clone().multiplyScalar(side * (roadWidth / 2 + 2.2)));
      const post = new THREE.Mesh(postGeo, postMat);
      post.position.set(pos.x, 0.65, pos.z);
      post.castShadow = true;
      scene.add(post);
    });
  }

  // =========================================================================
  //  TREES (varied, standard material for nicer shading)
  // =========================================================================
  function makeTree(x, z, scale, hue) {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.4, 2.4, 6),
      new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.9 })
    );
    trunk.position.y = 1.2; trunk.castShadow = true;
    group.add(trunk);
    const leafColor = new THREE.Color().setHSL(0.30 + hue, 0.45, 0.32 + Math.random() * 0.08);
    const leafMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.85 });
    for (let i = 0; i < 3; i++) {
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(1.5 - i * 0.32, 2.1, 8), leafMat);
      leaf.position.y = 2.5 + i * 1.35;
      leaf.castShadow = true;
      group.add(leaf);
    }
    group.position.set(x, 0, z);
    group.scale.setScalar(scale);
    return group;
  }
  function isNearTrack(x, z, minDist) {
    for (let i = 0; i < curvePts.length; i += 4) {
      const dx = curvePts[i].x - x, dz = curvePts[i].z - z;
      if (Math.sqrt(dx * dx + dz * dz) < minDist) return true;
    }
    return false;
  }
  for (let i = 0; i < 170; i++) {
    const x = (Math.random() - 0.5) * 520, z = (Math.random() - 0.5) * 520;
    if (isNearTrack(x, z, roadWidth / 2 + 6)) continue;
    scene.add(makeTree(x, z, 0.8 + Math.random() * 0.6, (Math.random() - 0.5) * 0.06));
  }
  rocks.forEach(r => { if (!isNearTrack(r.position.x, r.position.z, roadWidth/2 + 3)) scene.add(r); });

  // =========================================================================
  //  CAR — low wedge-shaped supercar (original design, Lambo-inspired)
  // =========================================================================
  function buildCar() {
    const car = new THREE.Group();
    const bodyWidth = 1.95;

    const shape = new THREE.Shape();
    shape.moveTo(-2.05, 0.10); shape.lineTo(-2.15, 0.32); shape.lineTo(-1.9, 0.55);
    shape.lineTo(-1.75, 0.85); shape.lineTo(-1.62, 0.98); shape.lineTo(-1.48, 0.86);
    shape.lineTo(-1.28, 0.60); shape.lineTo(-0.85, 1.0); shape.lineTo(0.25, 1.02);
    shape.lineTo(0.7, 0.76); shape.lineTo(1.3, 0.48); shape.lineTo(1.9, 0.26);
    shape.lineTo(2.15, 0.13); shape.lineTo(2.05, 0.07); shape.lineTo(1.6, 0.07);
    shape.lineTo(-1.95, 0.07); shape.closePath();

    const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: bodyWidth, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 2, curveSegments: 1 });
    bodyGeo.translate(0, 0, -bodyWidth / 2);
    bodyGeo.rotateY(-Math.PI / 2);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf7d91a, metalness: 0.55, roughness: 0.28, envMapIntensity: 1.2 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true; body.receiveShadow = true;
    car.add(body);
    car.userData.bodyMesh = body;

    const glass = new THREE.Mesh(
      new THREE.BoxGeometry(1.35, 0.42, 1.55),
      new THREE.MeshPhysicalMaterial({ color: 0x0c1218, metalness: 0.2, roughness: 0.08, transparent: true, opacity: 0.88, clearcoat: 0.6 })
    );
    glass.position.set(0, 0.92, -0.28); glass.castShadow = true;
    car.add(glass);

    const wingMat = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.5 });
    const wing = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.06, 0.42), wingMat);
    wing.position.set(0, 1.05, -1.85); wing.castShadow = true;
    car.add(wing);
    [[-0.6, 0.92, -1.85], [0.6, 0.92, -1.85]].forEach(p => {
      const strut = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.28, 0.07), wingMat);
      strut.position.set(p[0], p[1], p[2]);
      car.add(strut);
    });

    const trimMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
    [[-1.0, 0.18, -0.1], [1.0, 0.18, -0.1]].forEach(p => {
      const trim = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 2.6), trimMat);
      trim.position.set(p[0], p[1], p[2]);
      car.add(trim);
    });

    const headMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffaa, emissiveIntensity: 0.9, roughness: 0.3 });
    const headLights = [];
    [[-0.72, 0.42, 2.08], [0.72, 0.42, 2.08]].forEach(p => {
      const l = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.08, 0.12), headMat);
      l.position.set(p[0], p[1], p[2]);
      car.add(l); headLights.push(l);
    });

    const tailMat = new THREE.MeshStandardMaterial({ color: 0x550000, emissive: 0x990000, emissiveIntensity: 0.45, roughness: 0.4 });
    const tail = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 0.06), tailMat);
    tail.position.set(0, 0.55, -2.14);
    car.add(tail);
    car.userData.tailMat = tailMat;

    // headlight spotlights for a lit-track feel at dusk-ish exposure
    [-0.72, 0.72].forEach(x => {
      const spot = new THREE.SpotLight(0xfff6d8, 0.4, 40, Math.PI / 7, 0.5, 1.2);
      spot.position.set(x, 0.5, 2.1);
      const target = new THREE.Object3D();
      target.position.set(x, 0, 10);
      car.add(target);
      spot.target = target;
      car.add(spot);
    });

    const wheels = [];
    const wheelPositions = [
      [-1.02, 0.40, 1.45], [1.02, 0.40, 1.45], [-1.02, 0.40, -1.45], [1.02, 0.40, -1.45]
    ];
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.85 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xcfd4d8, metalness: 0.85, roughness: 0.25 });
    wheelPositions.forEach(p => {
      const wheelGroup = new THREE.Group();
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.34, 20), tireMat);
      tire.rotation.z = Math.PI / 2; tire.castShadow = true;
      wheelGroup.add(tire);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.36, 6), rimMat);
      rim.rotation.z = Math.PI / 2;
      wheelGroup.add(rim);
      wheelGroup.position.set(p[0], p[1], p[2]);
      car.add(wheelGroup);
      wheels.push(wheelGroup);
    });

    car.userData.wheels = wheels;
    car.userData.frontWheels = [wheels[0], wheels[1]];
    car.userData.rearWheelWorldOffsets = [wheelPositions[2], wheelPositions[3]];
    return car;
  }

  const car = buildCar();
  car.position.copy(trackPoints[0]);
  car.position.y = 0;
  scene.add(car);

  // =========================================================================
  //  EXHAUST PARTICLES
  // =========================================================================
  const smokeTex = makeRadialTexture('rgba(230,230,230,0.55)', 'rgba(230,230,230,0)', 64);
  const MAX_PARTICLES = 80;
  const exhaustParticles = [];
  const exhaustGroup = new THREE.Group();
  scene.add(exhaustGroup);
  for (let i = 0; i < MAX_PARTICLES; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0 }));
    s.scale.set(0.4, 0.4, 1);
    s.userData.life = 0;
    exhaustGroup.add(s);
    exhaustParticles.push(s);
  }
  let particleCursor = 0;
  function spawnExhaust(worldPos, boosting) {
    const p = exhaustParticles[particleCursor];
    particleCursor = (particleCursor + 1) % MAX_PARTICLES;
    p.position.copy(worldPos);
    p.userData.life = 1;
    p.userData.vy = 0.6 + Math.random() * 0.4;
    p.userData.vx = (Math.random() - 0.5) * 0.3;
    p.material.opacity = boosting ? 0.55 : 0.3;
    p.scale.set(0.3, 0.3, 1);
    p.material.color.set(boosting ? 0x88ccff : 0xffffff);
  }
  function updateExhaust(dt) {
    exhaustParticles.forEach(p => {
      if (p.userData.life <= 0) return;
      p.userData.life -= dt * 1.1;  
      p.position.y += p.userData.vy * dt;
      p.position.x += p.userData.vx * dt;
      p.scale.addScalar(dt * 1.4);
      p.material.opacity = Math.max(0, p.userData.life) * 0.5;
      if (p.userData.life <= 0) p.material.opacity = 0;
    });
  }

  // =========================================================================
  //  SKID MARKS (decal-like quads placed on the ground when drifting)
  // =========================================================================
  const skidMat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.35, depthWrite: false });
  const MAX_SKIDS = 300;
  const skidPool = [];
  const skidGroup = new THREE.Group();
  scene.add(skidGroup);
  for (let i = 0; i < MAX_SKIDS; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.9), skidMat.clone());
    m.rotation.x = -Math.PI / 2;
    m.visible = false;
    skidGroup.add(m);
    skidPool.push(m);
  }
  let skidCursor = 0;
  function spawnSkid(worldPos, angle, opacity) {
    const m = skidPool[skidCursor];
    skidCursor = (skidCursor + 1) % MAX_SKIDS;
    m.position.set(worldPos.x, 0.03, worldPos.z);
    m.rotation.z = -angle;
    m.material.opacity = opacity;
    m.visible = true;
  }

  // =========================================================================
  //  CAR STATE / ARCADE PHYSICS WITH DRIFT
  // =========================================================================
  const carState = {
    velocity: new THREE.Vector3(0, 0, 0), // world-space velocity
    heading: 0,
    steerAngle: 0,
    boost: 1.0, // 0..1 fuel
    boosting: false
  };
  const MAX_SPEED = 62;
  const BOOST_MAX_SPEED = 82;
  const MAX_REVERSE = -14;
  const ACCEL = 24;
  const BOOST_ACCEL = 40;
  const BRAKE_DECEL = 36;
  const NATURAL_DECEL = 6;
  const MAX_STEER = 0.55;
  const STEER_SPEED = 2.8;
  const STEER_RETURN = 3.6;
  const GRIP_NORMAL = 7.5;
  const GRIP_DRIFT = 1.4;
  const DRIFT_LATERAL_GAIN = 2.2;

  const initDir = new THREE.Vector3().subVectors(trackPoints[1], trackPoints[0]).normalize();
  carState.heading = Math.atan2(initDir.x, initDir.z);
  car.rotation.y = carState.heading;

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR') resetCar();
    if (e.code === 'KeyC') cycleCamera();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function resetCar() {
    car.position.copy(trackPoints[0]); car.position.y = 0;
    carState.velocity.set(0, 0, 0);
    carState.steerAngle = 0;
    const dir = new THREE.Vector3().subVectors(trackPoints[1], trackPoints[0]).normalize();
    carState.heading = Math.atan2(dir.x, dir.z);
    car.rotation.y = carState.heading;
  }
  document.getElementById('resetBtn').addEventListener('click', resetCar);

  const cameraModes = ['chase', 'close', 'top'];
  let camModeIndex = 0;
  function cycleCamera() { camModeIndex = (camModeIndex + 1) % cameraModes.length; }

  function updateCarPhysics(dt) {
    let steerInput = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) steerInput = 1;
    if (keys['KeyD'] || keys['ArrowRight']) steerInput = -1;

    if (steerInput !== 0) {
      carState.steerAngle += steerInput * STEER_SPEED * dt;
      carState.steerAngle = THREE.MathUtils.clamp(carState.steerAngle, -MAX_STEER, MAX_STEER);
    } else if (carState.steerAngle !== 0) {
      const s = Math.sign(carState.steerAngle);
      carState.steerAngle -= s * STEER_RETURN * dt;
      if (Math.sign(carState.steerAngle) !== s) carState.steerAngle = 0;
    }

    const accelInput = (keys['KeyW'] || keys['ArrowUp']) ? 1 : 0;
    const brakeInput = (keys['KeyS'] || keys['ArrowDown']) ? 1 : 0;
    const handbrake = keys['Space'] ? 1 : 0;
    const boostKey = (keys['ShiftLeft'] || keys['ShiftRight']) ? 1 : 0;

    // forward / right basis from current heading
    let forwardVec = new THREE.Vector3(Math.sin(carState.heading), 0, Math.cos(carState.heading));
    let rightVec = new THREE.Vector3(forwardVec.z, 0, -forwardVec.x);

    let forwardSpeed = carState.velocity.dot(forwardVec);
    let lateralSpeed = carState.velocity.dot(rightVec);

    // boost handling
    carState.boosting = boostKey && carState.boost > 0.05 && accelInput;
    if (carState.boosting) carState.boost = Math.max(0, carState.boost - dt * 0.45);
    else carState.boost = Math.min(1, carState.boost + dt * 0.18);

    const curMaxSpeed = carState.boosting ? BOOST_MAX_SPEED : MAX_SPEED;
    const curAccel = carState.boosting ? BOOST_ACCEL : ACCEL;

    if (accelInput) forwardSpeed += curAccel * dt;
    else if (brakeInput) forwardSpeed += (forwardSpeed > 0 ? -BRAKE_DECEL : -ACCEL * 0.7) * dt;
    else forwardSpeed -= Math.sign(forwardSpeed) * NATURAL_DECEL * dt * (Math.abs(forwardSpeed) > NATURAL_DECEL*dt ? 1:0);
    if (!accelInput && !brakeInput && Math.abs(forwardSpeed) < NATURAL_DECEL*dt) forwardSpeed = 0;

    if (handbrake) forwardSpeed *= (1 - Math.min(1, 1.6 * dt));

    forwardSpeed = THREE.MathUtils.clamp(forwardSpeed, MAX_REVERSE, curMaxSpeed);

    // yaw rate depends on steer + speed; drifting reduces grip so the tail can swing
    const speedFactor = THREE.MathUtils.clamp(Math.abs(forwardSpeed) / 9, 0, 1);
    let yawRate = carState.steerAngle * speedFactor * 1.9 * Math.sign(forwardSpeed || 1);

    // handbrake / high-speed sharp turns generate lateral slip (drift)
    const wantsDrift = handbrake || (Math.abs(carState.steerAngle) > MAX_STEER * 0.7 && Math.abs(forwardSpeed) > 18);
    if (wantsDrift && Math.abs(forwardSpeed) > 3) {
      lateralSpeed += -carState.steerAngle * Math.abs(forwardSpeed) * DRIFT_LATERAL_GAIN * dt;
    }

    const grip = wantsDrift ? GRIP_DRIFT : GRIP_NORMAL;
    lateralSpeed *= Math.max(0, 1 - grip * dt);

    carState.heading += yawRate * dt;

    forwardVec = new THREE.Vector3(Math.sin(carState.heading), 0, Math.cos(carState.heading));
    rightVec = new THREE.Vector3(forwardVec.z, 0, -forwardVec.x);
    carState.velocity.copy(forwardVec.multiplyScalar(forwardSpeed).add(rightVec.multiplyScalar(lateralSpeed)));

    car.position.addScaledVector(carState.velocity, dt);
    car.rotation.y = carState.heading;

    const bound = groundSize / 2 - 5;
    car.position.x = THREE.MathUtils.clamp(car.position.x, -bound, bound);
    car.position.z = THREE.MathUtils.clamp(car.position.z, -bound, bound);

    // wheel visuals
    const speedSigned = forwardVec.dot(carState.velocity);
    car.userData.wheels.forEach(w => { w.children[0].rotation.x -= speedSigned * dt * 1.6; w.children[1].rotation.x -= speedSigned * dt * 1.6; });
    car.userData.frontWheels.forEach(w => { w.rotation.y = carState.steerAngle * 0.7; });

    // tail light glow on brake
    car.userData.tailMat.emissiveIntensity = brakeInput ? 1.4 : 0.45;

    // exhaust + skid effects
    const speedRatio = Math.abs(forwardSpeed) / curMaxSpeed;
    if ((accelInput || carState.boosting) && Math.random() < 0.9) {
      const exhaustPos = car.position.clone().addScaledVector(forwardVec, -2.15);
      exhaustPos.y = 0.35;
      spawnExhaust(exhaustPos, carState.boosting);
    }
    if (wantsDrift && Math.abs(lateralSpeed) > 2) {
      car.userData.rearWheelWorldOffsets.forEach(off => {
        const worldOff = new THREE.Vector3(off[0], 0, off[2]).applyAxisAngle(new THREE.Vector3(0,1,0), carState.heading);
        const wp = car.position.clone().add(worldOff);
        spawnSkid(wp, carState.heading, Math.min(0.45, Math.abs(lateralSpeed) / 20));
      });
    }

    return { forwardSpeed, lateralSpeed, speedRatio, curMaxSpeed };
  }

  // =========================================================================
  //  CAMERA
  // =========================================================================
  let camShake = 0;
  function updateCamera(dt, physicsInfo) {
    const mode = cameraModes[camModeIndex];
    const carDir = new THREE.Vector3(Math.sin(carState.heading), 0, Math.cos(carState.heading));
    const speedRatio = THREE.MathUtils.clamp(physicsInfo.speedRatio, 0, 1);

    const targetFov = BASE_FOV + speedRatio * (MAX_FOV - BASE_FOV);
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 3);
    camera.updateProjectionMatrix();

    camShake = speedRatio * 0.06;
    const shakeOffset = new THREE.Vector3((Math.random() - 0.5) * camShake, (Math.random() - 0.5) * camShake, 0);

    if (mode === 'chase') {
      const camOffset = carDir.clone().multiplyScalar(-9 - speedRatio * 2).add(new THREE.Vector3(0, 4.2, 0));
      const desiredPos = car.position.clone().add(camOffset).add(shakeOffset);
      camera.position.lerp(desiredPos, 0.14);
      camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
    } else if (mode === 'close') {
      const camOffset = carDir.clone().multiplyScalar(-5).add(new THREE.Vector3(0, 2.1, 0));
      const desiredPos = car.position.clone().add(camOffset).add(shakeOffset);
      camera.position.lerp(desiredPos, 0.22);
      camera.lookAt(car.position.clone().add(carDir.clone().multiplyScalar(6)).add(new THREE.Vector3(0, 0.8, 0)));
    } else {
      const desiredPos = car.position.clone().add(new THREE.Vector3(0, 55, 0.1));
      camera.position.lerp(desiredPos, 0.15);
      camera.lookAt(car.position);
    }
  }

  // =========================================================================
  //  HUD: gauge canvas + minimap + fx canvas (speed lines / vignette)
  // =========================================================================
  const gaugeCanvas = document.getElementById('gaugeCanvas');
  const gctx = gaugeCanvas.getContext('2d');
  const gearBigEl = document.getElementById('gearBig');
  const rpmFillEl = document.getElementById('rpmBarFill');
  const boostFillEl = document.getElementById('boostBarFill');

  function drawGauge(speedKmh, maxKmh) {
    const w = gaugeCanvas.width, h = gaugeCanvas.height;
    gctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h - 6, radius = 78;
    const startAngle = Math.PI * 1.0, endAngle = Math.PI * 2.0;

    gctx.strokeStyle = 'rgba(255,255,255,0.18)';
    gctx.lineWidth = 10;
    gctx.beginPath(); gctx.arc(cx, cy, radius, startAngle, endAngle); gctx.stroke();

    const ratio = THREE.MathUtils.clamp(speedKmh / maxKmh, 0, 1);
    const grad = gctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#3fdc6a'); grad.addColorStop(0.6, '#f4d13d'); grad.addColorStop(1, '#ff4444');
    gctx.strokeStyle = grad;
    gctx.beginPath(); gctx.arc(cx, cy, radius, startAngle, startAngle + ratio * (endAngle - startAngle)); gctx.stroke();

    for (let i = 0; i <= 8; i++) {
      const a = startAngle + (i / 8) * (endAngle - startAngle);
      const x1 = cx + Math.cos(a) * (radius - 12), y1 = cy + Math.sin(a) * (radius - 12);
      const x2 = cx + Math.cos(a) * (radius - 2), y2 = cy + Math.sin(a) * (radius - 2);
      gctx.strokeStyle = 'rgba(255,255,255,0.5)'; gctx.lineWidth = 2;
      gctx.beginPath(); gctx.moveTo(x1, y1); gctx.lineTo(x2, y2); gctx.stroke();
    }

    const needleAngle = startAngle + ratio * (endAngle - startAngle);
    gctx.strokeStyle = '#ffffff'; gctx.lineWidth = 3;
    gctx.beginPath(); gctx.moveTo(cx, cy);
    gctx.lineTo(cx + Math.cos(needleAngle) * (radius - 16), cy + Math.sin(needleAngle) * (radius - 16));
    gctx.stroke();
    gctx.fillStyle = '#fff'; gctx.beginPath(); gctx.arc(cx, cy, 4, 0, Math.PI * 2); gctx.fill();

    gctx.fillStyle = '#fff'; gctx.font = '700 22px Segoe UI, Arial'; gctx.textAlign = 'center';
    gctx.fillText(Math.round(speedKmh), cx, cy - 26);
    gctx.font = '400 10px Segoe UI, Arial'; gctx.fillStyle = 'rgba(255,255,255,0.7)';
    gctx.fillText('km/h', cx, cy - 12);
  }

  const minimapCanvas = document.getElementById('minimap');
  const mctx = minimapCanvas.getContext('2d');
  minimapCanvas.width = 160; minimapCanvas.height = 160;
  function drawMinimap() {
    mctx.clearRect(0, 0, 160, 160);
    mctx.save(); mctx.translate(80, 80);
    const scale = 0.28;
    mctx.strokeStyle = 'rgba(255,255,255,0.6)'; mctx.lineWidth = 3;
    mctx.beginPath();
    curvePts.forEach((p, i) => { const x = p.x * scale, y = p.z * scale; i === 0 ? mctx.moveTo(x, y) : mctx.lineTo(x, y); });
    mctx.closePath(); mctx.stroke();
    mctx.fillStyle = '#ff4444';
    mctx.beginPath(); mctx.arc(car.position.x * scale, car.position.z * scale, 4, 0, Math.PI * 2); mctx.fill();
    mctx.restore();
  }

  // speed-line fx overlay
  const fxCanvas = document.getElementById('fx-canvas');
  const fctx = fxCanvas.getContext('2d');
  function resizeFx() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
  resizeFx();
  const vignetteEl = document.getElementById('vignette');

  function drawSpeedLines(speedRatio) {
    fctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    if (speedRatio < 0.45) { vignetteEl.style.opacity = 0; return; }
    const intensity = (speedRatio - 0.45) / 0.55;
    vignetteEl.style.opacity = intensity * 0.6;
    const cx = fxCanvas.width / 2, cy = fxCanvas.height / 2;
    const count = Math.floor(14 + intensity * 26);
    fctx.strokeStyle = `rgba(255,255,255,${0.05 + intensity * 0.18})`;
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rStart = 140 + Math.random() * 120;
      const len = 60 + intensity * 220 * Math.random();
      const x1 = cx + Math.cos(ang) * rStart, y1 = cy + Math.sin(ang) * rStart * 0.6;
      const x2 = cx + Math.cos(ang) * (rStart + len), y2 = cy + Math.sin(ang) * (rStart + len) * 0.6;
      fctx.lineWidth = 1 + Math.random() * 2;
      fctx.beginPath(); fctx.moveTo(x1, y1); fctx.lineTo(x2, y2); fctx.stroke();
    }
  }

  // =========================================================================
  //  MAIN LOOP
  // =========================================================================
  const clock = new THREE.Clock();
  let gearCosmetic = 1;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    const physicsInfo = updateCarPhysics(dt);
    updateCamera(dt, physicsInfo);
    updateExhaust(dt);

    clouds.forEach((c, i) => { c.position.x += dt * (2 + (i % 5)); if (c.position.x > 650) c.position.x = -650; });
    sunSprite.position.set(camera.position.x + 260, 190, camera.position.z + 90);
    sun.target.position.copy(car.position);

    const kmh = Math.abs(physicsInfo.forwardSpeed) * 7.2;
    const maxKmh = physicsInfo.curMaxSpeed * 7.2;
    drawGauge(kmh, MAX_SPEED_KMH());
    function MAX_SPEED_KMH() { return BOOST_MAX_SPEED * 7.2; }

    gearCosmetic = Math.min(6, 1 + Math.floor((kmh / maxKmh) * 6));
    gearBigEl.textContent = physicsInfo.forwardSpeed > 0.2 ? gearCosmetic : (physicsInfo.forwardSpeed < -0.2 ? 'R' : 'N');
    const rpmPct = Math.min(100, ((kmh / maxKmh) * 100 * 1.15) % 100 + (physicsInfo.forwardSpeed > 0.2 ? 15 : 0));
    rpmFillEl.style.width = Math.min(100, rpmPct) + '%';
    boostFillEl.style.width = (carState.boost * 100) + '%';

    drawMinimap();
    drawSpeedLines(THREE.MathUtils.clamp(kmh / (BOOST_MAX_SPEED * 7.2), 0, 1));

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    resizeFx();
  });

  animate();
})();
</script>
</body>
</html>
